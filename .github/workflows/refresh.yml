name: Refresh snapshot

# Phase 2a: manual trigger regenerates the snapshot + web bundle from the committed
# data and pushes; Vercel auto-deploys the commit to the same URL.
# Enable the `schedule` block once the Phase-2b incremental crawl lands in refresh.py.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "30 10 * * 1-5"   # 06:30 ET, weekdays
    - cron: "30 17 * * 1-5"   # 13:30 ET, weekdays

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 330          # under the 6h hosted-runner cap (headroom for a 2b subset crawl)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install pandas openpyxl requests rapidfuzz
      - name: Refresh snapshot + web bundle
        env:
          SEC_USER_AGENT: "WoodsonEquity research@woodsonequity.com"   # firm email, not a person's
        run: python3 refresh.py
      - name: Commit if changed
        run: |
          git config user.name  "woodson-refresh[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add web/snapshot.json web/index.html data/snapshot.json data/woodson_enriched.xlsx
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "refresh snapshot ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
