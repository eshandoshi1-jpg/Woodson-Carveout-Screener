name: Refresh snapshot

# Phase 2a: manual trigger regenerates the snapshot + web bundle from the committed
# data and pushes; Vercel auto-deploys the commit to the same URL.
# Enable the `schedule` block once the Phase-2b incremental crawl lands in refresh.py.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh.yml"
      - "refresh.py"
      - "pipeline_incremental.py"
      - "conditions_engine.py"
      - "requirements.txt"
      - "tests/**"
  schedule:
    # Off-round minutes reduce GitHub's scheduled-run queue delays.
    - cron: "17 10 * * *"     # 06:17 ET, daily; Saturday catches Friday's final SEC index
    - cron: "47 12 * * 1-5"   # 08:47 ET, weekdays; morning fallback if GitHub delays the first run
    - cron: "17 17 * * 1-5"   # 13:17 ET, weekdays

permissions:
  contents: write

concurrency:
  group: woodson-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 330          # under the 6h hosted-runner cap (headroom for a 2b subset crawl)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run correctness tests
        run: python3 -m unittest discover -s tests -v
      - name: Refresh snapshot + web bundle
        env:
          SEC_USER_AGENT: "WoodsonEquity research@woodsonequity.com"   # firm email, not a person's
        run: |
          for attempt in 1 2 3; do
            if python3 refresh.py; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Refresh failed after 3 attempts."
              exit 1
            fi
            delay=$((attempt * 60))
            echo "::warning::Refresh attempt $attempt failed; retrying in ${delay}s."
            sleep "$delay"
          done
      - name: Commit if changed
        run: |
          git config user.name  "woodson-refresh[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add web/snapshot.json web/index.html data/snapshot.json data/woodson_intelligence.html data/woodson_enriched.xlsx data/state.json data/previous_tiers.json
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "refresh snapshot ($(date -u +%Y-%m-%dT%H:%MZ))"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
